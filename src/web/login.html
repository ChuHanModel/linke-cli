<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>linke · 教务账号配置</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8; color: #1f2328; padding: 24px;
  }
  @media (prefers-color-scheme: dark) { body { background: #14171a; color: #e2e6ea; } }
  .card {
    width: 100%; max-width: 380px; background: #fff; border-radius: 12px;
    padding: 28px 24px; box-shadow: 0 4px 24px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) { .card { background: #1d2126; } }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #6a737d; margin-bottom: 20px; line-height: 1.6; }
  @media (prefers-color-scheme: dark) { .sub { color: #9aa4af; } }
  label { display: block; font-size: 13px; margin: 14px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid #d0d7de;
    border-radius: 8px; background: transparent; color: inherit;
  }
  @media (prefers-color-scheme: dark) { input { border-color: #3a4149; } }
  input:focus { outline: 2px solid #4c8dff; border-color: transparent; }
  button {
    width: 100%; margin-top: 22px; padding: 11px; font-size: 15px; border: 0;
    border-radius: 8px; background: #2da44e; color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .msg { margin-top: 16px; font-size: 13px; line-height: 1.7; display: none; }
  .msg.ok { display: block; color: #1a7f37; }
  .msg.err { display: block; color: #cf222e; }
</style>
</head>
<body>
  <main class="card">
    <h1>林课 linke · 教务账号配置</h1>
    <p class="sub">此页面由<strong>你本机的 linke CLI</strong> 提供，密码只保存在本机
    （~/.linke-cli/，权限 600），不会发送到任何服务器。</p>
    <form id="form">
      <label for="userId">学号</label>
      <input id="userId" name="userId" autocomplete="username" inputmode="numeric" required>
      <label for="password">教务密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="btn" type="submit">保存到本机</button>
    </form>
    <p id="msg" class="msg"></p>
  </main>
<script>
  const params = new URLSearchParams(location.search)
  const token = params.get('t') || ''
  const form = document.getElementById('form')
  const btn = document.getElementById('btn')
  const msg = document.getElementById('msg')
  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    msg.className = 'msg'
    btn.disabled = true
    btn.textContent = '保存中...'
    try {
      const res = await fetch('/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token,
          userId: document.getElementById('userId').value.trim(),
          password: document.getElementById('password').value
        })
      })
      const data = await res.json()
      if (data.ok) {
        msg.className = 'msg ok'
        msg.textContent = '已保存到本机 ~/.linke-cli/config.json（权限 600）。' +
          '本页面服务已自动关闭，可以关闭此标签页；回到终端查看验证结果。'
        form.style.display = 'none'
      } else {
        throw new Error(data.error || '保存失败')
      }
    } catch (err) {
      msg.className = 'msg err'
      msg.textContent = '保存失败：' + err.message + '。请回终端重新运行 linke login 后重试。'
      btn.disabled = false
      btn.textContent = '保存到本机'
    }
  })
</script>
</body>
</html>
