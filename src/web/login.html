<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教务账号登录</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8; color: #1f2328; padding: 24px;
  }
  @media (prefers-color-scheme: dark) { body { background: #14171a; color: #e2e6ea; } }
  .card {
    width: 100%; max-width: 380px; background: #fff; border-radius: 12px;
    padding: 28px 24px; box-shadow: 0 4px 24px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) { .card { background: #1d2126; } }
  h1 { font-size: 18px; margin: 0 0 6px; }
  .sub { font-size: 13px; color: #6a737d; margin-bottom: 18px; line-height: 1.6; }
  @media (prefers-color-scheme: dark) { .sub { color: #9aa4af; } }
  label { display: block; font-size: 13px; margin: 14px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid #d0d7de;
    border-radius: 8px; background: transparent; color: inherit;
  }
  @media (prefers-color-scheme: dark) { input { border-color: #3a4149; } }
  input:focus { outline: 2px solid #4c8dff; border-color: transparent; }
  button {
    width: 100%; margin-top: 22px; padding: 11px; font-size: 15px; border: 0;
    border-radius: 8px; background: #2da44e; color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .msg { margin-top: 16px; font-size: 13px; line-height: 1.7; display: none; white-space: pre-line; }
  .msg.cred { display: block; color: #cf222e; }
  .msg.svc { display: block; color: #9a6700; }
  .verifying { display: none; text-align: center; padding: 18px 0 8px; }
  .verifying .spinner {
    width: 34px; height: 34px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid #d0d7de; border-top-color: #2da44e;
    animation: spin 0.9s linear infinite;
  }
  @media (prefers-color-scheme: dark) { .verifying .spinner { border-color: #3a4149; border-top-color: #2da44e; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .verifying p { font-size: 14px; color: #6a737d; line-height: 1.7; }
  @media (prefers-color-scheme: dark) { .verifying p { color: #9aa4af; } }
  .success { display: none; text-align: center; padding: 10px 0 0; }
  .success .mark { font-size: 40px; line-height: 1; }
  .success h2 { font-size: 17px; margin: 10px 0 6px; }
  .success .info { font-size: 14px; color: #6a737d; line-height: 1.8; }
  @media (prefers-color-scheme: dark) { .success .info { color: #9aa4af; } }
  .success .next {
    margin-top: 16px; padding: 12px; border-radius: 8px; background: #f0f6ff;
    font-size: 13px; line-height: 1.8; text-align: left;
  }
  @media (prefers-color-scheme: dark) { .success .next { background: #1b2635; } }
  .success .done { margin-top: 14px; font-size: 13px; color: #1a7f37; }
</style>
</head>
<body>
  <main class="card">
    <h1>教务账号登录</h1>
    <p class="sub">密码只保存在这台电脑上，不会发送到任何服务器。</p>

    <form id="form">
      <label for="userId">学号</label>
      <input id="userId" name="userId" autocomplete="username" inputmode="numeric" required>
      <label for="password">教务密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="btn" type="submit">登录</button>
    </form>
    <p id="msg" class="msg"></p>

    <div id="verifying" class="verifying">
      <div class="spinner"></div>
      <p>正在验证…<br>（大约需要几秒钟，请别关掉这个页面）</p>
    </div>

    <div id="success" class="success">
      <div class="mark">✅</div>
      <h2>登录成功</h2>
      <p class="info" id="okInfo"></p>
      <div class="next">现在可以直接问你的 AI：<br>「我这周有什么课」「我的成绩怎么样」</div>
      <p class="done">都设置好啦，可以关闭这个页面了。</p>
    </div>
  </main>
<script>
  const params = new URLSearchParams(location.search)
  const token = params.get('t') || ''
  const form = document.getElementById('form')
  const btn = document.getElementById('btn')
  const msg = document.getElementById('msg')
  const verifying = document.getElementById('verifying')
  const success = document.getElementById('success')
  const userIdInput = document.getElementById('userId')
  const passwordInput = document.getElementById('password')
  let polling = null
  let pollFailures = 0
  let submittedOnce = false

  function showForm() {
    form.style.display = ''
    verifying.style.display = 'none'
    success.style.display = 'none'
    btn.disabled = false
    btn.textContent = '登录'
  }
  function showVerifying() {
    form.style.display = 'none'
    msg.className = 'msg'
    verifying.style.display = 'block'
  }
  function showSuccess(info) {
    form.style.display = 'none'
    verifying.style.display = 'none'
    msg.className = 'msg'
    success.style.display = 'block'
    document.getElementById('okInfo').textContent = info
    setTimeout(() => window.close(), 2500) // 关不掉就停留在「可关闭」状态页
  }
  function showBanner(text) {
    msg.className = 'msg svc'
    msg.textContent = text
  }
  function renderFailResult(data) {
    showForm()
    if (data.type === 'credential') {
      msg.className = 'msg cred'
      msg.textContent = '学号或密码不对。\n' +
        '⚠️ 连续输错可能会锁住教务账号，请确认后再试' +
        (data.remaining > 0 ? '（还剩 ' + data.remaining + ' 次机会）。' : '。')
    } else {
      msg.className = 'msg svc'
      msg.textContent = '刚才没验证成功：网络或验证码识别临时出了问题，和密码无关。\n' +
        '稍等一下再试就行' + (data.remaining > 0 ? '（还剩 ' + data.remaining + ' 次）' : '') + '。'
    }
    if (data.final) {
      btn.disabled = true
      btn.textContent = '尝试次数已用完'
      msg.textContent += '\n尝试次数用完了（共 ' + data.maxAttempts + ' 次），这个页面马上关闭；请回到电脑终端重新开始。'
    }
  }

  async function pollResult() {
    try {
      const res = await fetch('/result?t=' + encodeURIComponent(token), {
        headers: { 'Accept': 'application/json' }
      })
      if (res.status === 403) {
        stopPoll()
        submittedOnce = false
        msg.className = 'msg svc'
        msg.textContent = '这个页面已经失效（可能已完成、超时或次数用完）。\n请回到电脑终端查看结果。'
        showForm()
        btn.disabled = true
        btn.textContent = '页面已失效'
        return
      }
      const data = await res.json()
      pollFailures = 0
      if (data.status === 'verifying' || data.status === 'idle') return
      stopPoll()
      submittedOnce = false
      if (data.type === 'success') {
        const s = data.summary || {}
        const lines = []
        if (s.name) lines.push('姓名：' + s.name)
        if (s.unit) lines.push(s.unit)
        if (s.weekNow) lines.push('当前是第 ' + s.weekNow + ' 周' + (s.weekAll ? '（共 ' + s.weekAll + ' 周）' : ''))
        showSuccess(lines.length ? lines.join('\n') : '教务登录验证通过，密码已保存。')
        return
      }
      renderFailResult(data)
    } catch {
      // 联系不上服务 ≠ 提交失败：静默重试，持续失败才提示，绝不诱导重复提交
      pollFailures += 1
      if (pollFailures >= 12) {
        showBanner('页面和服务失去联系（已经重试了约 10 秒），还在自动重试…\n' +
          '请不要关掉页面，也不要再点「登录」——重复提交会占用尝试次数，连续输错可能锁号。\n' +
          '可以先到电脑终端看看是不是已经完成了。')
      }
    }
  }
  function stopPoll() {
    if (polling) { clearInterval(polling); polling = null }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    msg.className = 'msg'
    btn.disabled = true
    btn.textContent = '提交中...'
    try {
      const res = await fetch('/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token,
          userId: userIdInput.value.trim(),
          password: passwordInput.value
        })
      })
      const data = await res.json()
      if (!data.ok) throw new Error(data.error || '提交失败')
      submittedOnce = true
      showVerifying()
      passwordInput.value = ''
      stopPoll()
      pollFailures = 0
      polling = setInterval(pollResult, 800)
      pollResult()
    } catch (err) {
      msg.className = 'msg svc'
      msg.textContent = '没能连上这台电脑上的登录页面服务，刚才的提交没有送出去（不会计入尝试次数）。\n' +
        '如果你电脑开着 Clash、Stash、Surge 这类代理工具，它们可能拦住了本机地址——' +
        '请把本地地址设为直连，或者暂时关掉代理再试。'
      btn.disabled = false
      btn.textContent = '登录'
    }
  })

  // 页面（重新）加载时恢复进度：已提交过就先提醒，防止无感重复提交
  ;(async function restoreState() {
    try {
      const res = await fetch('/state?t=' + encodeURIComponent(token))
      if (res.status === 403) return
      const state = await res.json()
      if (state.attempts > 0) {
        msg.className = 'msg svc'
        msg.textContent = '这个页面已经试过 ' + state.attempts + ' 次（最多 ' +
          state.maxAttempts + ' 次）。连续输错可能会锁住教务账号，请确认密码后再提交（还剩 ' +
          state.remaining + ' 次）。'
      }
      if (state.status === 'verifying') {
        showVerifying()
        submittedOnce = true
        stopPoll()
        polling = setInterval(pollResult, 800)
        pollResult()
      } else if (state.status === 'done' && state.result) {
        submittedOnce = false
        if (state.result.type === 'success') {
          const s = state.result.summary || {}
          const lines = []
          if (s.name) lines.push('姓名：' + s.name)
          if (s.weekNow) lines.push('当前是第 ' + s.weekNow + ' 周')
          showSuccess(lines.length ? lines.join('\n') : '教务登录验证通过，密码已保存。')
        } else {
          renderFailResult(state.result)
        }
      }
    } catch {
      /* 拿不到进度不碍事，正常显示表单 */
    }
  })()
</script>
</body>
</html>
